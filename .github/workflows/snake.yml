# 贡献蛇动画：每日根据 GitHub 贡献记录自动生成 SVG
# 生成结果推送到 output 分支，README 中引用 dist/github-contribution-grid-snake.svg
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: wangliuyong
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=A78BFA&color_dots=30363D,1A1B26,2D2F3F,7DD3FC&color_circle=0D1117
