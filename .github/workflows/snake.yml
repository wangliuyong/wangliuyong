# 贡献蛇动画：根据 GitHub 贡献记录自动生成 SVG 并推送到 output 分支
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: wangliuyong
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=A78BFA&color_dots=30363D,1A1B26,2D2F3F,7DD3FC,FFFFFF
